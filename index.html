<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>قلب باللسان 👅</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:#fff;font-family:Arial;overflow:hidden;height:100vh}
  #reels{height:100vh;overflow:hidden;position:relative}
  .reel{height:100vh;width:100%;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .4s}
  .reel video{width:100%;height:100%;object-fit:cover}
  .reel-info{position:absolute;bottom:100px;right:15px;text-align:right}
  .reel-info h2{font-size:22px}
  .reel-info p{opacity:.8}
  #cam{position:fixed;top:10px;left:10px;width:110px;height:150px;border:2px solid #00e676;border-radius:15px;object-fit:cover;z-index:10;transform:scaleX(-1)}
  #status{position:fixed;top:10px;right:10px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:20px;z-index:10;font-size:14px}
  #mouthBar{position:fixed;top:170px;left:10px;width:110px;height:8px;background:#333;border-radius:10px;z-index:10;overflow:hidden}
  #mouthFill{height:100%;width:0%;background:#00e676;transition:.1s}
  #tongueBtn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff1744;border:none;color:#fff;padding:14px 25px;border-radius:30px;font-size:18px;z-index:20}
  #debug{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.7;z-index:10}
</style>
</head>
<body>

<div id="status">👅 طلع لسانك عشان تقلب</div>
<video id="cam" playsinline muted></video>
<div id="mouthBar"><div id="mouthFill"></div></div>
<div id="debug">بانتظار الكاميرا...</div>

<div id="reels">
  <div class="reel" style="background:#111">
    <video src="https://cdn.coverr.co/videos/coverr-a-man-skateboarding-in-a-skate-park-1584/1080p.mp4" autoplay muted loop playsinline></video>
    <div class="reel-info"><h2>فيديو 1 🔥</h2><p>طلع لسانك للفيديو اللي بعده</p></div>
  </div>
  <div class="reel" style="background:#222">
    <video src="https://cdn.coverr.co/videos/coverr-cats-playing-with-a-ball-of-yarn-1589/1080p.mp4" autoplay muted loop playsinline></video>
    <div class="reel-info"><h2>فيديو 2 🐱</h2><p>شغال! كمل</p></div>
  </div>
  <div class="reel" style="background:#333">
    <video src="https://cdn.coverr.co/videos/coverr-surfer-riding-a-wave-1569/1080p.mp4" autoplay muted loop playsinline></video>
    <div class="reel-info"><h2>فيديو 3 🌊</h2><p>آخر فيديو</p></div>
  </div>
</div>

<button id="tongueBtn" onclick="nextReel()">👅 جرب بدون كاميرا - اضغط هنا</button>

<script>
let current = 0;
let lastTrigger = 0;
let cooldown = 1200; // عشان ما يقلب 10 مرات ورا بعض
const reels = document.getElementById('reels');
const statusEl = document.getElementById('status');
const debugEl = document.getElementById('debug');
const mouthFill = document.getElementById('mouthFill');

function nextReel(){
  current = (current + 1) % 3;
  reels.style.transform = `translateY(-${current * 100}vh)`;
  statusEl.textContent = "✅ قلبت! فيديو " + (current+1);
  setTimeout(()=> statusEl.textContent = "👅 طلع لسانك عشان تقلب", 1500);
}
function prevReel(){
  current = (current - 1 + 3) % 3;
  reels.style.transform = `translateY(-${current * 100}vh)`;
}

const videoEl = document.getElementById('cam');

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

faceMesh.onResults((res)=>{
  if(!res.multiFaceLandmarks || res.multiFaceLandmarks.length===0){
    debugEl.textContent = "ما اشوف وجهك، قرب شوي";
    return;
  }
  const lm = res.multiFaceLandmarks[0];
  // 13 = فوق الشفة العليا، 14 = تحت الشفة السفلى، 17 = فوق، 18 = تحت
  // نحسب فتحة الفم
  const top = lm[13];
  const bottom = lm[14];
  const left = lm[61];
  const right = lm[291];
  const mouthOpen = Math.abs(bottom.y - top.y);
  const mouthWidth = Math.abs(right.x - left.x);
  const ratio = mouthOpen / mouthWidth; // كل ما زاد يعني فمك مفتوح اكثر

  const percent = Math.min(100, Math.round(ratio * 400));
  mouthFill.style.width = percent + "%";

  debugEl.textContent = "فتحة الفم: " + percent + "% - اذا وصلت 35% يقلب";

  // اذا طلعت لسانك / فتحت فمك بقوة
  if(ratio > 0.28){
    const now = Date.now();
    if(now - lastTrigger > cooldown){
      lastTrigger = now;
      statusEl.textContent = "👅 شفت لسانك! جاري التقليب...";
      nextReel();
    }
  }
});

const camera = new Camera(videoEl, {
  onFrame: async () => { await faceMesh.send({image: videoEl}); },
  width: 640, height: 480
});
camera.start();
</script>
</body>
<style>html{
 color:darkviolet;
 font-size:25px;
 font-weight:600;
}
</style><script>/*Here write your javascript code*/</script></html>
